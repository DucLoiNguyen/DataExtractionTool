apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataextraction-web
  labels: {app: dataextraction-web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: dataextraction-web}
  template:
    metadata:
      labels: {app: dataextraction-web}
    spec:
      containers:
        - name: web
          image: dataextraction-web:local   # doi thanh anh tren registry cua ban
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dataextraction-web
spec:
  selector: {app: dataextraction-web}
  ports:
    - port: 80
      targetPort: 8000
