services:
  web:
    build: .
    image: dataextraction-web:local
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Loi vao thu muc tam la noi duy nhat ung dung ghi file -> co the de root filesystem chi doc
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
